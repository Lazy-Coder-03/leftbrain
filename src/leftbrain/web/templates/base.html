<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}leftbrain{% endblock %}</title>
<meta name="description" content="Exact, deterministic tools for AI agents: math, dates, units, ordering, validation. MCP server and REST API.">
<link rel="icon" href="/static/logo.svg?v={{ asset_v }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/site.css?v={{ asset_v }}">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="brand" href="/"><img src="/static/logo.svg?v={{ asset_v }}" alt="" width="26" height="26">leftbrain</a>
    <div class="links">
      <a href="/#tools" {% if page == 'landing' %}aria-current="page"{% endif %}>Tools</a>
      <a href="/docs" {% if page == 'docs' %}aria-current="page"{% endif %}>Docs</a>
      <a href="/dashboard" {% if page == 'dashboard' %}aria-current="page"{% endif %}>Keys</a>
    </div>
    {% if user %}<a class="btn ghost" href="/dashboard">{{ user.login }}</a>{% else %}<a class="btn primary" href="/login">Get an API key</a>{% endif %}
  </nav>
  {% block content %}{% endblock %}
  <footer><span>© 2026 leftbrain · MIT · <a href="/docs/changelog">v{{ version }}</a></span><span><a href="https://github.com/Lazy-Coder-03/leftbrain">GitHub</a> · <a href="https://pypi.org/project/leftbrain/">PyPI</a> · <a href="/healthz">Status</a></span></footer>
</div>
<script src="/static/site.js?v={{ asset_v }}" defer></script>
</body>
</html>
