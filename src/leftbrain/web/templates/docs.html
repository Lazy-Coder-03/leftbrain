{% extends "base.html" %}
{% block title %}{{ title }} · leftbrain docs{% endblock %}
{% block content %}
<div class="docs">
  <nav class="toc" aria-label="Docs">
    <div class="grp">Start</div>
    {% for s, t in pages %}<a href="/docs/{{ s }}" class="{{ 'cur' if s == slug and not tool else '' }}">{{ t }}</a>{% endfor %}
    {% if tools %}<div class="grp">Tools</div>
    {% for n in tools %}<a href="/docs/tools/{{ n }}" class="{{ 'cur' if n == tool else '' }}">{{ n }}</a>{% endfor %}{% endif %}
  </nav>
  <article class="doc">{{ body|safe }}</article>
</div>
{% endblock %}
