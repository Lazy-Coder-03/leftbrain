[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leftbrain"
version = "0.5.0"
description = "The left brain for your AI agent - exact, deterministic answers for everything LLMs are bad at: math, dates, units, scaling, validation, and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sayantan Ghosh" }]
keywords = ["mcp", "agents", "llm", "tools", "math", "datetime", "deterministic", "sympy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "sympy>=1.13",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "jsonschema>=4.20",
    "holidays>=0.60",
    "pint>=0.24",
    "sqlglot>=25",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
external = ["httpx>=0.27"]
files = ["pypdf>=4.0", "pillow>=10.0"]
server = ["mcp>=2.0", "httpx>=0.27", "uvicorn>=0.30", "starlette>=0.40", "jinja2>=3.1", "itsdangerous>=2.1", "markdown-it-py>=3", "cryptography>=42", "pebble>=5.0"]
postgres = ["psycopg[binary]>=3.1"]
all = ["mcp>=2.0", "httpx>=0.27", "pypdf>=4.0", "pillow>=10.0", "uvicorn>=0.30", "starlette>=0.40", "jinja2>=3.1", "itsdangerous>=2.1", "markdown-it-py>=3", "cryptography>=42", "psycopg[binary]>=3.1", "pebble>=5.0"]
dev = ["mcp>=2.0", "httpx>=0.27", "pypdf>=4.0", "pillow>=10.0", "uvicorn>=0.30", "starlette>=0.40", "jinja2>=3.1", "itsdangerous>=2.1", "markdown-it-py>=3", "cryptography>=42", "psycopg[binary]>=3.1", "pebble>=5.0", "pytest>=8", "ruff>=0.6"]

[project.scripts]
leftbrain = "leftbrain.mcp_server:main"
leftbrain-external = "leftbrain.external.mcp_server:main"
leftbrain-files = "leftbrain.files.mcp_server:main"
leftbrain-serve = "leftbrain.serve:main"
leftbrain-keys = "leftbrain.keys:main"

[project.urls]
Homepage = "https://leftbrain.idlesync.in"
Documentation = "https://leftbrain.idlesync.in/docs"
Repository = "https://github.com/Lazy-Coder-03/leftbrain"
Issues = "https://github.com/Lazy-Coder-03/leftbrain/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/leftbrain"]

# The root CHANGELOG.md is the only copy; the site serves it at /docs/changelog, so the
# wheel needs it next to the other docs pages. A dev checkout has no copy and falls back
# to the root file (leftbrain.web.docs.ROOT_SOURCES).
[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "leftbrain/web/docs/changelog.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
